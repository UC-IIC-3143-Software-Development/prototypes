version: "3.8"

services:
  db:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: counter_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: counter_db
    ports:
      # 3307 en el host: cada proyecto con MySQL usa un puerto propio para que
      # se puedan levantar todos a la vez y ningun script se conecte a la base
      # de otro. Ver la tabla de puertos en el README de la raiz.
      - "3307:3306"
    command:
      - --max-connections=150
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
