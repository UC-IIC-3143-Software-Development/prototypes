version: "3.8"

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: ecommerce
    ports:
      # 3308 en el host: cada proyecto con MySQL usa un puerto propio para que
      # se puedan levantar todos a la vez y ningun script se conecte a la base
      # de otro. Ver la tabla de puertos en el README de la raiz.
      - "3308:3306"
    volumes:
      - ./init_db.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
